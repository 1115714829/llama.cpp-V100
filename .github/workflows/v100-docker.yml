# Docker image of this project (V100 / sm_70), built from .devops/v100-cuda.Dockerfile.
# Runs only when started by hand (Actions -> V100 docker -> Run workflow); nothing is scheduled and
# nothing is pushed to a registry. The x86_64 (linux/amd64) image is saved with `docker save` and
# uploaded as a workflow artifact. The linux/ppc64le image (IBM Power AC922 only) is built on an
# AC922 host with the same Dockerfile; GitHub has no ppc64le machine for it.
name: V100 docker

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'image version tag, e.g. 1.1.0'
        required: true

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  amd64:
    runs-on: ubuntu-24.04
    steps:
      - name: Free disk space
        run: |
          # the CUDA devel base image and the build need more than the default free space
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo docker image prune -af
          df -h /

      - name: Clone
        uses: actions/checkout@v6

      - name: Build
        run: |
          docker build -f .devops/v100-cuda.Dockerfile --target server \
            -t "llama.cpp-v100:server-${{ inputs.version }}-amd64" .

      - name: Smoke test (no GPU on the runner)
        run: |
          img="llama.cpp-v100:server-${{ inputs.version }}-amd64"
          # libcuda.so.1 comes from the host driver at run time; every other library must resolve in the image
          missing=$(docker run --rm --entrypoint bash "$img" -c 'ldd /app/llama-server /app/libggml-cuda.so | grep "not found" | grep -v "libcuda.so.1" || true')
          [ -z "$missing" ] || { echo "missing libraries: $missing"; exit 1; }
          docker run --rm --entrypoint ffmpeg "$img" -version | head -1

      - name: Save
        run: |
          name="llama.cpp-v100-server-${{ inputs.version }}-amd64"
          docker save "llama.cpp-v100:server-${{ inputs.version }}-amd64" | gzip -1 > "$name.tar.gz"
          ls -l "$name.tar.gz"

      - name: Upload
        uses: actions/upload-artifact@v6
        with:
          name: llama.cpp-v100-server-${{ inputs.version }}-amd64
          path: llama.cpp-v100-server-*-amd64.tar.gz
          compression-level: 0
          retention-days: 14
          if-no-files-found: error
